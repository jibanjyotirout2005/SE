<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer | Hotel Restaurant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#243b55 0%,transparent 40%),
        radial-gradient(circle at bottom right,#141e30 0%,transparent 45%),
        #0b1220;
    color:#fff;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.page{
    min-height:100vh;
    padding:25px;
}

.container{
    width:100%;
    max-width:1250px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    backdrop-filter:blur(14px);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.primary-btn{
    border:none;
    padding:12px 22px;
    border-radius:10px;
    background:#00c6ff;
    color:#07111d;
    font-weight:700;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,198,255,.25);
}

.secondary-btn{
    border:1px solid rgba(255,255,255,.2);
    padding:11px 20px;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    color:#fff;
    font-weight:600;
}

.danger-btn{
    border:none;
    padding:9px 15px;
    border-radius:8px;
    background:#ef4444;
    color:white;
    font-weight:700;
}

.message{
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:18px;
    display:none;
    font-size:14px;
}

.message.show{
    display:block;
}

.message.error{
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.35);
    color:#fecaca;
}

.message.success{
    background:rgba(34,197,94,.15);
    border:1px solid rgba(34,197,94,.35);
    color:#bbf7d0;
}

.message.info{
    background:rgba(0,198,255,.12);
    border:1px solid rgba(0,198,255,.3);
    color:#bae6fd;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.brand{
    font-size:25px;
    font-weight:800;
}

.brand span{
    color:#00c6ff;
}

.header-actions{
    display:flex;
    gap:10px;
}

/* CUSTOMER INFO */

.customer-info{
    padding:25px;
    margin-bottom:25px;
}

.customer-info h1{
    font-size:30px;
    margin-bottom:8px;
}

.customer-info p{
    color:#aeb8c8;
    line-height:1.5;
}

.customer-form{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:22px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#d9e2ef;
    font-size:14px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:13px 14px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    outline:none;
    background:rgba(0,0,0,.2);
    color:#fff;
}

.form-group input:focus{
    border-color:#00c6ff;
    box-shadow:0 0 0 2px rgba(0,198,255,.1);
}

/* MAIN LAYOUT */

.main-grid{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:22px;
    align-items:start;
}

.content-card{
    padding:25px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
}

.section-header h2{
    font-size:22px;
}

.section-header p{
    color:#9ca8ba;
    font-size:13px;
    margin-top:5px;
}

/* DISHES */

.dish-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.dish-card{
    padding:18px;
    overflow:hidden;
}

.dish-image{
    width:100%;
    height:190px;
    border-radius:13px;
    object-fit:cover;
    margin-bottom:15px;
    background:
        linear-gradient(
            135deg,
            rgba(0,198,255,.15),
            rgba(255,255,255,.04)
        );
}

.no-image{
    width:100%;
    height:190px;
    border-radius:13px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.05);
    color:#7f8ba0;
    font-size:14px;
}

.dish-category{
    color:#00c6ff;
    font-size:12px;
    margin-bottom:7px;
}

.dish-card h3{
    margin-bottom:7px;
}

.dish-description{
    color:#aeb8c8;
    font-size:13px;
    line-height:1.5;
    min-height:40px;
}

.dish-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
}

.dish-price{
    font-size:20px;
    font-weight:800;
}

.dish-rating{
    color:#facc15;
    font-size:13px;
}

.stock{
    margin-top:10px;
    color:#22c55e;
    font-size:12px;
    font-weight:700;
}

.unavailable{
    color:#ef4444;
}

/* CART */

.cart-card{
    padding:25px;
    position:sticky;
    top:20px;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.cart-header h2{
    font-size:22px;
}

.cart-count{
    background:rgba(0,198,255,.12);
    color:#00c6ff;
    border:1px solid rgba(0,198,255,.25);
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.cart-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:430px;
    overflow-y:auto;
}

.cart-item{
    padding:14px;
    border-radius:11px;
    background:rgba(255,255,255,.04);
}

.cart-item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-item-name{
    font-weight:700;
}

.cart-item-info{
    color:#9ca8ba;
    font-size:12px;
    margin-top:5px;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.qty-btn{
    width:28px;
    height:28px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:#fff;
}

.qty-number{
    min-width:25px;
    text-align:center;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    padding:18px 0;
    margin-top:18px;
    border-top:1px solid rgba(255,255,255,.1);
    font-size:21px;
    font-weight:800;
}

.empty-state{
    text-align:center;
    padding:40px 20px;
    color:#9ca8ba;
}

/* ORDER RESULT */

.order-result{
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.2);
}

.order-result h3{
    color:#86efac;
    margin-bottom:8px;
}

.order-result p{
    color:#cbd5e1;
    font-size:13px;
    line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .main-grid{
        grid-template-columns:1fr;
    }

    .cart-card{
        position:static;
    }

}

@media(max-width:750px){

    .customer-form{
        grid-template-columns:1fr;
    }

    .dish-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

}

@media(max-width:500px){

    .page{
        padding:15px;
    }

    .customer-info,
    .content-card,
    .cart-card{
        padding:18px;
    }

    .dish-image,
    .no-image{
        height:170px;
    }

}
</style>
</head>

<body>

<div class="page">

<div class="container">

<!-- ======================================================
     HEADER
====================================================== -->

<div class="header">

    <div class="brand">
        HOTEL <span>RESTAURANT</span>
    </div>

    <div class="header-actions">

        <button
            class="secondary-btn"
            onclick="loadDishes()"
        >
            Refresh
        </button>

        <button
            class="secondary-btn"
            onclick="clearCart()"
        >
            Clear Cart
        </button>

    </div>

</div>


<!-- ======================================================
     CUSTOMER INFORMATION
====================================================== -->

<div class="card customer-info">

    <h1>
        Welcome, Customer
    </h1>

    <p>
        Browse our dishes and place your order.
    </p>

    <div
        id="orderMessage"
        class="message"
    ></div>

    <div class="customer-form">

        <div class="form-group">

            <label for="customerName">
                Customer Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label for="customerPhone">
                Phone Number
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label for="tableNumber">
                Table Number
            </label>

            <input
                type="number"
                id="tableNumber"
                placeholder="Enter table number"
                min="1"
            >

        </div>

    </div>

</div>


<!-- ======================================================
     MAIN
====================================================== -->

<div class="main-grid">


<!-- ======================================================
     DISHES
====================================================== -->

<div class="card content-card">

    <div class="section-header">

        <div>

            <h2>
                Our Dishes
            </h2>

            <p>
                Select dishes and add them to your cart.
            </p>

        </div>

    </div>


    <div
        id="dishGrid"
        class="dish-grid"
    >

        <div class="empty-state">
            Loading dishes...
        </div>

    </div>

</div>


<!-- ======================================================
     CART
====================================================== -->

<div class="card cart-card">

    <div class="cart-header">

        <h2>
            Your Cart
        </h2>

        <span
            id="cartCount"
            class="cart-count"
        >
            0 items
        </span>

    </div>


    <div
        id="cartList"
        class="cart-list"
    >

        <div class="empty-state">
            Your cart is empty.
        </div>

    </div>


    <div class="cart-total">

        <span>
            Total
        </span>

        <span>
            ₹<span id="cartTotal">0.00</span>
        </span>

    </div>


    <button
        id="placeOrderButton"
        class="primary-btn"
        style="width:100%;"
        onclick="placeOrder()"
    >
        Place Order
    </button>


    <div
        id="orderResult"
        class="order-result hidden"
    >

        <h3>
            Order Placed
        </h3>

        <p id="orderResultText"></p>

    </div>

</div>

</div>

</div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE = window.location.origin;

let dishes = [];

let cart = {};


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    message,
    type = "info"
){

    const element =
        document.getElementById(
            "orderMessage"
        );

    element.textContent =
        message;

    element.className =
        "message show " + type;
}


function clearMessage(){

    const element =
        document.getElementById(
            "orderMessage"
        );

    element.textContent = "";

    element.className =
        "message";
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(imageUrl){

    if(!imageUrl){
        return "";
    }

    imageUrl =
        String(imageUrl).trim();

    if(!imageUrl){
        return "";
    }

    if(
        imageUrl.startsWith("http://") ||
        imageUrl.startsWith("https://") ||
        imageUrl.startsWith("data:")
    ){

        return imageUrl;

    }

    if(imageUrl.startsWith("/")){
        return API_BASE + imageUrl;
    }

    return API_BASE + "/" + imageUrl;

}


/* =========================================================
   LOAD DISHES
========================================================= */

async function loadDishes(){

    const grid =
        document.getElementById(
            "dishGrid"
        );

    grid.innerHTML = `
        <div class="empty-state">
            Loading dishes...
        </div>
    `;

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/dishes"
            );

        const result =
            await response.json();

        if(
            !response.ok ||
            !result.success
        ){

            throw new Error(
                result.message ||
                "Unable to load dishes."
            );

        }

        dishes =
            result.dishes || [];

        renderDishes();

    }
    catch(error){

        console.error(
            "Load dishes error:",
            error
        );

        grid.innerHTML = `
            <div class="empty-state">
                Unable to load dishes.
                <br><br>
                Check whether Flask is running.
            </div>
        `;

    }

}


/* =========================================================
   RENDER DISHES
========================================================= */

function renderDishes(){

    const grid =
        document.getElementById(
            "dishGrid"
        );


    const available =
        dishes.filter(
            dish =>
                Boolean(dish.IsAvailable) &&
                Number(
                    dish.AvailableQuantity
                ) > 0
        );


    if(!available.length){

        grid.innerHTML = `
            <div class="empty-state">
                No dishes are currently available.
            </div>
        `;

        return;
    }


    grid.innerHTML =
        available.map(
            dish => {

                const quantity =
                    cart[dish.DishID] || 0;

                const image =
                    getImageUrl(
                        dish.ImageURL
                    );


                return `

                <div class="card dish-card">

                    ${
                        image
                        ?
                        `
                        <img
                            src="${escapeHtml(image)}"
                            class="dish-image"
                            alt="${escapeHtml(dish.DishName)}"
                            onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden');"
                        >

                        <div class="no-image hidden">
                            Image unavailable
                        </div>
                        `
                        :
                        `
                        <div class="no-image">
                            No image available
                        </div>
                        `
                    }


                    <div class="dish-category">

                        ${escapeHtml(
                            dish.Category || ""
                        )}

                    </div>


                    <h3>

                        ${escapeHtml(
                            dish.DishName || ""
                        )}

                    </h3>


                    <div class="dish-description">

                        ${escapeHtml(
                            dish.Description || ""
                        )}

                    </div>


                    <div class="dish-bottom">

                        <div class="dish-price">

                            ₹${Number(
                                dish.Price || 0
                            ).toFixed(2)}

                        </div>


                        <div class="dish-rating">

                            ★ ${Number(
                                dish.Rating || 0
                            ).toFixed(1)}

                        </div>

                    </div>


                    <div class="stock">

                        ${Number(
                            dish.AvailableQuantity
                        )} available

                    </div>


                    <div
                        class="cart-controls"
                        style="margin-top:14px;"
                    >

                        <button
                            class="qty-btn"
                            onclick="changeQuantity(
                                ${dish.DishID},
                                -1
                            )"
                        >
                            −
                        </button>


                        <span class="qty-number">

                            ${quantity}

                        </span>


                        <button
                            class="qty-btn"
                            onclick="changeQuantity(
                                ${dish.DishID},
                                1
                            )"
                        >
                            +
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(
    dishId,
    change
){

    const dish =
        dishes.find(
            item =>
                Number(item.DishID) ===
                Number(dishId)
        );


    if(!dish){
        return;
    }


    let quantity =
        cart[dishId] || 0;


    quantity += change;


    if(quantity < 0){
        quantity = 0;
    }


    const stock =
        Number(
            dish.AvailableQuantity
        );


    if(quantity > stock){

        quantity = stock;

    }


    if(quantity === 0){

        delete cart[dishId];

    }
    else{

        cart[dishId] =
            quantity;

    }


    renderDishes();

    renderCart();

}


/* =========================================================
   RENDER CART
========================================================= */

function renderCart(){

    const list =
        document.getElementById(
            "cartList"
        );

    let total = 0;

    let totalItems = 0;


    const selected =
        Object.entries(cart);


    if(!selected.length){

        list.innerHTML = `
            <div class="empty-state">
                Your cart is empty.
            </div>
        `;

        document
            .getElementById(
                "cartTotal"
            )
            .textContent =
            "0.00";

        document
            .getElementById(
                "cartCount"
            )
            .textContent =
            "0 items";

        return;

    }


    list.innerHTML =
        selected.map(
            ([dishId,quantity]) => {

                const dish =
                    dishes.find(
                        item =>
                            Number(
                                item.DishID
                            ) ===
                            Number(dishId)
                    );


                if(!dish){
                    return "";
                }


                const price =
                    Number(
                        dish.Price || 0
                    );


                const qty =
                    Number(quantity);


                const subtotal =
                    price * qty;


                total += subtotal;

                totalItems += qty;


                return `

                <div class="cart-item">

                    <div class="cart-item-top">

                        <div>

                            <div class="cart-item-name">

                                ${escapeHtml(
                                    dish.DishName
                                )}

                            </div>

                            <div class="cart-item-info">

                                ${qty}
                                ×
                                ₹${price.toFixed(2)}

                            </div>

                        </div>


                        <strong>

                            ₹${subtotal.toFixed(2)}

                        </strong>

                    </div>


                    <div class="cart-controls">

                        <button
                            class="qty-btn"
                            onclick="changeQuantity(
                                ${dish.DishID},
                                -1
                            )"
                        >
                            −
                        </button>


                        <span class="qty-number">

                            ${qty}

                        </span>


                        <button
                            class="qty-btn"
                            onclick="changeQuantity(
                                ${dish.DishID},
                                1
                            )"
                        >
                            +
                        </button>


                        <button
                            class="danger-btn"
                            style="margin-left:auto;"
                            onclick="removeFromCart(
                                ${dish.DishID}
                            )"
                        >
                            Remove
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");


    document
        .getElementById(
            "cartTotal"
        )
        .textContent =
        total.toFixed(2);


    document
        .getElementById(
            "cartCount"
        )
        .textContent =
        totalItems +
        (totalItems === 1
            ? " item"
            : " items");

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeFromCart(
    dishId
){

    delete cart[dishId];

    renderDishes();

    renderCart();

}


/* =========================================================
   CLEAR CART
========================================================= */

function clearCart(){

    cart = {};

    renderDishes();

    renderCart();

    clearMessage();

    document
        .getElementById(
            "orderResult"
        )
        .classList.add(
            "hidden"
        );

}


/* =========================================================
   PLACE ORDER
========================================================= */

async function placeOrder(){

    clearMessage();


    const customerName =
        document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


    const phone =
        document
            .getElementById(
                "customerPhone"
            )
            .value
            .trim();


    const tableNumber =
        document
            .getElementById(
                "tableNumber"
            )
            .value
            .trim();


    const selected =
        Object.entries(cart);


    /* -------------------------------------------------------
       VALIDATION
    ------------------------------------------------------- */

    if(!customerName){

        showMessage(
            "Please enter your name.",
            "error"
        );

        return;

    }


    if(
        !/^[0-9]{10}$/.test(phone)
    ){

        showMessage(
            "Please enter a valid 10-digit phone number.",
            "error"
        );

        return;

    }


    if(!tableNumber){

        showMessage(
            "Please enter your table number.",
            "error"
        );

        return;

    }


    if(!selected.length){

        showMessage(
            "Please select at least one dish.",
            "error"
        );

        return;

    }


    const items =
        selected.map(
            ([dish_id,quantity]) => ({

                dish_id:
                    Number(dish_id),

                quantity:
                    Number(quantity)

            })
        );


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    button.disabled = true;

    button.textContent =
        "Placing Order...";


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/customer/place-order",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            customer_name:
                                customerName,

                            phone:
                                phone,

                            table_number:
                                tableNumber,

                            items:
                                items

                        })

                }
            );


        const result =
            await response.json();


        if(
            !response.ok ||
            !result.success
        ){

            showMessage(
                result.message ||
                "Unable to place order.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------------
           SUCCESS
        --------------------------------------------------- */

        showMessage(
            "Your order has been placed successfully.",
            "success"
        );


        const order =
            result.order || {};


        document
            .getElementById(
                "orderResultText"
            )
            .innerHTML = `

                Order ID:
                <strong>
                    #${escapeHtml(
                        order.order_id || ""
                    )}
                </strong>
                <br>

                Customer:
                ${escapeHtml(
                    customerName
                )}
                <br>

                Table:
                ${escapeHtml(
                    tableNumber
                )}
                <br>

                Total:
                ₹${Number(
                    order.total_amount || 0
                ).toFixed(2)}
                <br>

                Status:
                ${escapeHtml(
                    order.status || "Pending"
                )}

            `;


        document
            .getElementById(
                "orderResult"
            )
            .classList.remove(
                "hidden"
            );


        /* ---------------------------------------------------
           CLEAR CART AFTER SUCCESS
        --------------------------------------------------- */

        cart = {};

        renderCart();

        await loadDishes();


        /* Keep customer information.
           It is intentionally NOT automatically filled. */

        document
            .getElementById(
                "customerName"
            )
            .value = "";

        document
            .getElementById(
                "customerPhone"
            )
            .value = "";

        document
            .getElementById(
                "tableNumber"
            )
            .value = "";


    }
    catch(error){

        console.error(
            "Place order error:",
            error
        );

        showMessage(
            "Unable to connect to the server. Make sure Flask is running.",
            "error"
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "Place Order";

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        /* IMPORTANT:
           Do not automatically put any name,
           phone or previous cart into the form. */

        document
            .getElementById(
                "customerName"
            )
            .value = "";

        document
            .getElementById(
                "customerPhone"
            )
            .value = "";

        document
            .getElementById(
                "tableNumber"
            )
            .value = "";


        cart = {};

        renderCart();

        loadDishes();

    }
);

</script>
